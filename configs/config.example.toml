# Copy to ~/.agenterm/config.toml  (or: agenterm init)

# Named preset: ollama-local | ollama-remote | sglang | xai | openai | custom
provider = "ollama-local"

# User workspace; defaults to the directory where bolt is launched.
# workspace = "/scratch/projects/my-repo"

# Interactive permission policy: ask | allow | plan
permission_mode = "ask"
vision_enabled = false

# Chat model (Ollama tag, SGLang served-model-name, or cloud model id)
# Default for Go + documentation agent work: qwen2.5-coder:32b
# (see docs/grok-parity-roadmap.md). Alternate Ollama: qwen3-coder:30b
# SGLang (GGUF basename / --served-model-name): qwen2.5-coder-32b-q4_k_m.gguf
model = "qwen2.5-coder:32b"

# OpenAI-compatible root. Always include /v1
# Local Ollama / SSH tunnel:
#   base_url = "http://127.0.0.1:11434/v1"
# Remote Ollama on another Linux box:
#   base_url = "http://192.168.1.50:11434/v1"
# SGLang (local or SSH tunnel to :30000):
#   base_url = "http://127.0.0.1:30000/v1"
base_url = "http://127.0.0.1:11434/v1"

# Ollama/SGLang accept any key; cloud providers need a real secret.
# Prefer env: AGENTERM_API_KEY, OLLAMA_API_KEY, XAI_API_KEY, OPENAI_API_KEY
api_key = "ollama"

temperature = 0.7
max_tokens = 0

# Tool calling (list_dir, read_file, find_files, …). Greetings never attach tools.
# Set false or run: agenterm --no-tools   for pure chat speed.
enable_tools = true
# bash/curl/wget/scripts via run_shell (set false or use --no-shell to disable)
enable_shell = true
# Default for run_tests tool (empty = auto: go test ./... | make test)
# test_command = "go test ./..."

system_prompt = """
You are agenterm, a fast terminal coding assistant that CAN change files on disk.

Style:
- Be concise. Yes/no first when asked yes/no.
- Never invent file listings or paths; only use tool results.
- When asked to do/apply/implement/edit: use str_replace, write_file, and git tools — do not only print steps.

Tools: list_dir, read_file, write_file, str_replace, find_files, git (optional run_shell).
"""

# --- Provider presets (switch with provider = "…") ---

[providers.ollama-local]
base_url = "http://127.0.0.1:11434/v1"
api_key = "ollama"
model = "qwen2.5-coder:32b"

[providers.ollama-remote]
# Change host to your remote Ollama server
base_url = "http://127.0.0.1:11434/v1"
api_key = "ollama"
model = "qwen2.5-coder:32b"

[providers.sglang]
# SGLang OpenAI-compatible server (default listen 127.0.0.1:30000).
# Model id is usually --served-model-name (often the GGUF file basename).
# Prefer dense GGUF (e.g. qwen2.5-coder); some MoE GGUFs are unstable in SGLang.
base_url = "http://127.0.0.1:30000/v1"
api_key = "sglang"
model = "qwen2.5-coder-32b-q4_k_m.gguf"

[providers.xai]
base_url = "https://api.x.ai/v1"
# api_key from env XAI_API_KEY
model = "grok-3"

[providers.openai]
base_url = "https://api.openai.com/v1"
# api_key from env OPENAI_API_KEY
model = "gpt-4o-mini"

# --- Optional MCP tool servers ---

[[mcp_servers]]
name = "mcp-demo"
enabled = false
url = "http://127.0.0.1:8080/mcp"
