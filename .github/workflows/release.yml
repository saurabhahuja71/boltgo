name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.25.x"

jobs:
  # Single job: cross-compile all platforms + create GitHub Release (avoids artifact handoff issues)
  release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cross-compile binaries
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          build() {
            local goos=$1 goarch=$2
            local ext=""
            [[ "$goos" == windows ]] && ext=".exe"
            local out="dist/agenterm-${goos}-${goarch}${ext}"
            echo "→ $out"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "$out" ./cmd/agenterm
            (cd dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")
          }
          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: agenterm ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## agenterm ${{ steps.ver.outputs.tag }}

            Terminal AI agent — **native binaries** + **container**.

            ### Native (recommended — no container limits)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/saurabhahuja71/boltgo/main/scripts/install.sh | bash
            agenterm --version
            agenterm
            ```

            Or download a specific asset from this release, e.g. `agenterm-linux-amd64`.

            ### Container (Podman / Docker)

            ```bash
            podman run --rm -it --network=host \
              -e AGENTERM_BASE_URL=http://127.0.0.1:11434/v1 \
              -v "$HOME/.agenterm:/home/agenterm/.agenterm:Z" \
              ghcr.io/saurabhahuja71/agenterm:${{ steps.ver.outputs.tag }}
            ```

            Point `AGENTERM_BASE_URL` at local or remote Ollama (`…:11434/v1`).
          files: |
            dist/agenterm-linux-amd64
            dist/agenterm-linux-amd64.sha256
            dist/agenterm-linux-arm64
            dist/agenterm-linux-arm64.sha256
            dist/agenterm-darwin-amd64
            dist/agenterm-darwin-amd64.sha256
            dist/agenterm-darwin-arm64
            dist/agenterm-darwin-arm64.sha256
            dist/agenterm-windows-amd64.exe
            dist/agenterm-windows-amd64.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/saurabhahuja71/agenterm:${{ steps.ver.outputs.tag }}
            ghcr.io/saurabhahuja71/agenterm:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          platforms: linux/amd64
